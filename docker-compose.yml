services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: openaicubes_rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"   # Puerto AMQP para comunicación entre nodos y Backend Central
      - "15672:15672" # Panel web de administración (Management UI)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openaicubes_net

  postgres_db1:
    image: postgres:15-bullseye
    container_name: openaicubes_postgres
    hostname: postgres_db1
    restart: always
    environment:
      POSTGRES_USER: cube_user
      POSTGRES_PASSWORD: cube_password
      POSTGRES_DB: openaicubes_db1
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/node_db1_nodejs/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cube_user -d openaicubes_db1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openaicubes_net

  mariadb_db2:
    image: mariadb:10.11
    container_name: openaicubes_mariadb
    hostname: mariadb_db2
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: openaicubes_db2
      MARIADB_USER: cube_user
      MARIADB_PASSWORD: cube_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./src/node_db2_go/init_mariadb.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openaicubes_net

  node_db2_go:
    build:
      context: ./src/node_db2_go
      dockerfile: Dockerfile
    container_name: openaicubes_node_db2_go
    hostname: node_db2_go
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      mariadb_db2:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DB2_QUEUE: db2_validation_queue
      MARIADB_HOST: mariadb_db2
      MARIADB_PORT: "3306"
      MARIADB_USER: cube_user
      MARIADB_PASSWORD: cube_password
      MARIADB_DATABASE: openaicubes_db2
    networks:
      - openaicubes_net

volumes:
  postgres_data:
  mariadb_data:

networks:
  openaicubes_net:
    driver: bridge
